<!-- Delete Task Modal -->
<div class="modal-overlay" id="deleteTaskModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
  <div class="modal-box" role="document" style="max-width:420px;">
    <div class="modal-header">
      <h4 id="deleteModalTitle" style="color:var(--danger);">
        <i class="bi bi-trash3" style="margin-right:6px;"></i>Delete Task
      </h4>
      <button class="modal-close-btn" onclick="closeDeleteModal()" title="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body">
      <p style="font-size:14px;color:var(--text-secondary);margin-bottom:6px;">
        Are you sure you want to delete this task?
      </p>
      <p style="font-weight:600;color:var(--text-primary);font-size:14px;background:var(--bg);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);" id="deleteTaskTitle">
        Task Name
      </p>
      <p style="font-size:12.5px;color:var(--danger);">
        <i class="bi bi-exclamation-triangle"></i> This action cannot be undone.
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-secondary-custom" onclick="closeDeleteModal()">Cancel</button>
      <button type="button"
              class="btn-primary-custom"
              id="confirmDeleteBtn"
              style="background:var(--danger);"
              onclick="confirmDelete()">
        <i class="bi bi-trash3"></i> Delete Task
      </button>
    </div>
  </div>
</div>
