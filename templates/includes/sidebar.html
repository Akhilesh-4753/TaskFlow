<aside class="sidebar" id="sidebar">
  <!-- Brand -->
  <div class="sidebar-brand">
    <a href="{% url 'tasks:dashboard' %}" class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <i class="bi bi-check2-square"></i>
      </div>
      <span class="sidebar-logo-text">TaskFlow</span>
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <ul class="sidebar-menu">
      <li class="sidebar-menu-item">
        <a href="{% url 'tasks:dashboard' %}"
           class="sidebar-nav-link {% if active_page == 'dashboard' %}active{% endif %}">
          <i class="bi bi-columns-gap sidebar-nav-icon"></i>
          <span class="sidebar-nav-text">Dashboard</span>
        </a>
      </li>
      <li class="sidebar-menu-item">
        <a href="{% url 'tasks:task_list' %}"
           class="sidebar-nav-link {% if active_page == 'tasks' %}active{% endif %}">
          <i class="bi bi-card-checklist sidebar-nav-icon"></i>
          <span class="sidebar-nav-text">All Tasks</span>
        </a>
      </li>
      <li class="sidebar-menu-item">
        <a href="{% url 'reports:report_dashboard' %}"
           class="sidebar-nav-link {% if active_page == 'reports' %}active{% endif %}">
          <i class="bi bi-bar-chart-line sidebar-nav-icon"></i>
          <span class="sidebar-nav-text">Reports</span>
        </a>
      </li>
      <li class="sidebar-menu-item">
        <a href="{% url 'accounts:profile' %}"
           class="sidebar-nav-link {% if active_page == 'profile' %}active{% endif %}">
          <i class="bi bi-person sidebar-nav-icon"></i>
          <span class="sidebar-nav-text">Profile</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer / Logout -->
  <div class="sidebar-footer">
    <form method="post" action="{% url 'accounts:logout' %}" style="margin:0;padding:0;width:100%;">
      {% csrf_token %}
      <button type="submit" class="sidebar-logout-btn">
        <i class="bi bi-box-arrow-left sidebar-nav-icon"></i>
        <span class="sidebar-nav-text">Logout</span>
      </button>
    </form>
  </div>
</aside>
